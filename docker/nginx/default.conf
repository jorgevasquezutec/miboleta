server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    index index.html index.php;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Serve storage files with CORS (logos, public uploads)
    location /storage/ {
        add_header Access-Control-Allow-Origin "http://localhost:5173" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Cache-Control "public, max-age=86400";

        if ($request_method = OPTIONS) {
            return 204;
        }

        try_files $uri =404;
    }

    # Serve static files directly
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
    }

    # El worker de PDF.js (assets/pdf.worker*.mjs) es un modulo ES. mime.types
    # de nginx no trae la extension .mjs (solo "js"), asi que sin esto lo
    # sirve como application/octet-stream y el navegador rechaza el import()
    # dinamico con "Failed to fetch dynamically imported module": el visor de
    # documentos queda en blanco.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API routes go to Laravel (always pass to PHP-FPM)
    location /api {
        try_files $uri /index.php?$query_string;
    }

    # Horizon dashboard go to Laravel (always pass to PHP-FPM)
    location /horizon {
        try_files $uri /index.php?$query_string;
    }

    # Laravel Reverb WebSocket proxy
    location /app {
        # Igual que fastcgi_pass: con el nombre directo, nginx exige resolver
        # `reverb` al ARRANCAR y, si no está levantado todavía, se niega a
        # arrancar entero ("host not found in upstream") — tumbando el sitio
        # completo por un servicio secundario. Con variable + resolver, nginx
        # arranca igual y resuelve al llegar la primera petición.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_reverb reverb:8080;
        proxy_pass http://$backend_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Laravel PHP handler
    location ~ \.php$ {
        # fastcgi_pass con VARIABLE, no con el nombre directo: nginx resuelve
        # `app` una sola vez al arrancar y cachea la IP para siempre. Si el
        # contenedor de PHP se reinicia (p. ej. porque MySQL aun no aceptaba
        # conexiones en el primer arranque), cambia de IP y nginx sigue
        # apuntando a la vieja: 502 permanente. Con una variable, nginx vuelve
        # a resolver contra el DNS interno de Docker (127.0.0.11).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_php app:9000;
        fastcgi_pass $backend_php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # SPA fallback - serve index.html for all non-file routes
    # This allows React Router to handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
