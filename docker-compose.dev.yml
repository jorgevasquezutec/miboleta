version: '3.8'

# Docker Compose para DESARROLLO
# Frontend corre fuera de Docker con Vite HMR
# Solo levanta: Laravel + MySQL

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: miboleta_app_dev
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # Mount del código para hot reload
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=miboleta
      - DB_USERNAME=miboleta_user
      - DB_PASSWORD=secret123
    depends_on:
      - mysql
    networks:
      - miboleta_network

  nginx:
    image: nginx:alpine
    container_name: miboleta_nginx_dev
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Mount del código backend (Laravel)
      - ./backend/public:/var/www/html/public:ro
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - miboleta_network

  mysql:
    image: mysql:8.0
    container_name: miboleta_mysql_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: miboleta
      MYSQL_USER: miboleta_user
      MYSQL_PASSWORD: secret123
    ports:
      - "3307:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - miboleta_network

volumes:
  mysql_dev_data:
    driver: local

networks:
  miboleta_network:
    driver: bridge
