name: Build & Deploy

on:
  # Solo corre después de que Tests pase exitosamente
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

# Un solo despliegue a producción a la vez. `cancel-in-progress: false` a
# propósito: NO interrumpir un deploy a mitad de `stack deploy`/`migrate`
# (dejaría el stack a medio aplicar). Si llegan varios, se serializan y GitHub
# conserva solo el pending más reciente (cancela los intermedios) -> el burst
# converge al último estado, nunca en paralelo. Group constante = un target.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # Solo ejecutar si Tests pasó exitosamente (o si es workflow_dispatch manual)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      
      - name: Create Vite env file from secrets
        run: |
          cat << EOF > config/.env.vite.swarm
          # Auto-generated from GitHub Secrets
          VITE_API_URL=/api
          VITE_REVERB_APP_KEY="${{ secrets.VITE_REVERB_APP_KEY }}"
          VITE_REVERB_HOST="${{ secrets.VITE_REVERB_HOST }}"
          VITE_REVERB_PORT="80"
          VITE_REVERB_SCHEME="http"
          EOF
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_ENV_FILE=config/.env.vite.swarm
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Imagen aparte para el sidecar de firma legal (signer/). Swarm no puede
      # construir `build:`, así que la publicamos aquí y el stack la referencia
      # por `image:` (ghcr.io/<repo>-signer). Ver docker-stack.yml servicio signer.
      - name: Extract metadata (signer)
        id: meta-signer
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-signer
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push (signer)
        uses: docker/build-push-action@v5
        with:
          context: ./signer
          push: true
          tags: ${{ steps.meta-signer.outputs.tags }}
          labels: ${{ steps.meta-signer.outputs.labels }}
          cache-from: type=gha,scope=signer
          cache-to: type=gha,mode=max,scope=signer

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout (para docker-stack.yml y config/nginx.conf)
        uses: actions/checkout@v4
      
      - name: Install VPN and SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openfortivpn sshpass
      
      - name: Connect to VPN
        run: |
          # Crear config VPN
          cat << EOF | sudo tee /tmp/vpn_config
          host = ${{ secrets.VPN_HOST }}
          port = ${{ secrets.VPN_PORT }}
          username = ${{ secrets.VPN_USER }}
          password = ${{ secrets.VPN_PASS }}
          trusted-cert = ${{ secrets.VPN_CERT }}
          set-dns = 0
          EOF
          
          # Conectar VPN y capturar logs
          echo "Conectando a VPN..."
          sudo openfortivpn -c /tmp/vpn_config > /tmp/vpn.log 2>&1 &
          VPN_PID=$!
          echo $VPN_PID | sudo tee /tmp/vpn_pid
          
          # Esperar conexión (hasta 60 segundos)
          echo "Esperando conexión VPN (60s)..."
          CONNECTED=false
          for i in {1..12}; do
            sleep 5
            if ip addr show | grep -qE "ppp|tun"; then
              echo "✓ Interfaz VPN detectada"
              CONNECTED=true
              break
            fi
            echo "Esperando interfaz VPN... ($((i*5))s)"
            tail -5 /tmp/vpn.log 2>/dev/null || true
          done
          
          # Esperar a que las rutas se establezcan (15 segundos adicionales)
          if [ "$CONNECTED" = true ]; then
            echo "Esperando rutas VPN (15s)..."
            sleep 15
          fi
          
          # Mostrar log completo de VPN
          echo "=== LOG VPN ==="
          tail -10 /tmp/vpn.log || true
          
          if [ "$CONNECTED" = false ]; then
            echo "❌ VPN no se conectó"
            exit 1
          fi
          
          # Verificar conectividad
          echo "=== Probando conectividad a ${{ secrets.SSH_HOST }} ==="
          ping -c 3 -W 5 ${{ secrets.SSH_HOST }} || echo "⚠ Ping falló (puede funcionar igual)"
          
          echo "=== Probando puerto SSH ==="
          nc -zv -w 10 ${{ secrets.SSH_HOST }} ${{ secrets.SSH_PORT }} 2>&1 || echo "⚠ Puerto SSH timeout"
      
      - name: Copy stack file to server
        env:
          SSH_PASS: ${{ secrets.SSH_PASS }}
        run: |
          sshpass -p "${SSH_PASS}" scp \
            -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=no \
            -P ${{ secrets.SSH_PORT }} \
            docker-stack.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/miboleta/

      # docker-stack.yml monta ./config/nginx.conf del HOST como bind-mount, no
      # va dentro de la imagen: si el CI no lo copia, los cambios de nginx del
      # repo NUNCA llegan a produccion por mas que se redespliegue el stack.
      # Paso justo lo que ocurrio con el bloque `location ~* \.mjs$` (b082c64):
      # commiteado, mergeado a main, desplegado muchas veces... y el visor de
      # PDF siguio roto semanas porque el nginx.conf del servidor era el viejo.
      - name: Copy nginx config to server
        env:
          SSH_PASS: ${{ secrets.SSH_PASS }}
        run: |
          sshpass -p "${SSH_PASS}" scp \
            -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=no \
            -P ${{ secrets.SSH_PORT }} \
            config/nginx.conf \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/miboleta/config/nginx.conf
      
      - name: Deploy via SSH
        env:
          SSH_PASS: ${{ secrets.SSH_PASS }}
        run: |
          sshpass -p "${SSH_PASS}" ssh \
            -o ConnectTimeout=30 \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'DEPLOY_SCRIPT'
          
          set -e
          cd /opt/miboleta
          
          # Carga robusta del .env.stack (de aqui salen las ${VARIABLES} que
          # interpola docker-stack.yml). Con `export $(cat ... | xargs)` basta
          # un valor con espacios o comillas para que xargs lo parta y deje
          # REDIS_PASSWORD VACIO: redis arranca con `--requirepass` sin
          # argumento, crashea en bucle y se lleva por delante horizon y reverb,
          # que dependen de el. Ya paso una vez en produccion.
          echo "=== Loading environment variables ==="
          set -a; . ./.env.stack; set +a
          
          echo "=== Pulling latest image ==="
          docker pull ghcr.io/${{ github.repository }}:latest
          docker pull ghcr.io/${{ github.repository }}-signer:latest

          echo "=== Deploying stack ==="
          docker stack deploy -c docker-stack.yml miboleta --with-registry-auth
          
          echo "=== Waiting for services to start (60s) ==="
          sleep 60
          
          echo "=== Service status ==="
          docker stack services miboleta
          
          echo "=== Running post-deploy commands ==="
          # Esperar a que el contenedor app esté listo
          APP_CONTAINER=""
          for i in {1..12}; do
            APP_CONTAINER=$(docker ps -qf "name=miboleta_app" | head -1)
            if [ -n "$APP_CONTAINER" ]; then
              echo "App container found: $APP_CONTAINER"
              break
            fi
            echo "Waiting for app container... ($i/12)"
            sleep 5
          done
          
          if [ -z "$APP_CONTAINER" ]; then
            echo "❌ App container not found after 60s"
            exit 1
          fi
          
          # Esperar a que MySQL esté listo (hasta 90 segundos)
          echo "=== Waiting for MySQL to be ready ==="
          for i in {1..18}; do
            if docker exec $APP_CONTAINER php artisan tinker --execute="DB::connection()->getPdo();" 2>/dev/null; then
              echo "✓ MySQL is ready!"
              break
            fi
            echo "Waiting for MySQL... ($i/18)"
            sleep 5
          done
          
          echo "=== Running migrations ==="
          docker exec $APP_CONTAINER php artisan migrate --force || echo "⚠ Migrations skipped"
          
          echo "=== Caching configuration ==="
          docker exec $APP_CONTAINER php artisan config:cache || true
          docker exec $APP_CONTAINER php artisan route:cache || true
          docker exec $APP_CONTAINER php artisan view:cache || true
          
          # El nginx.conf recien copiado NO se aplica solo: `stack deploy` no
          # toca el servicio si su spec no cambio, y como el bind-mount es de
          # ARCHIVO unico, el scp deja un inode nuevo que el contenedor viejo
          # ni siquiera ve (por eso `nginx -s reload` puede "pasar" sin aplicar
          # nada). Se valida primero y se fuerza la task para que rebindee.
          # El nginx.conf recien copiado NO se aplica solo: `stack deploy` no
          # toca el servicio si su spec no cambio, y como el bind-mount es de
          # ARCHIVO unico, el scp deja un inode NUEVO que el contenedor en
          # marcha ni siquiera ve. Por eso hay que forzar la task para que
          # rebindee, y por eso la validacion va en un contenedor DESECHABLE:
          # un `docker exec ... nginx -t` sobre el contenedor vivo estaria
          # validando el archivo VIEJO y daria OK aunque el nuevo este roto.
          echo "=== Applying nginx config ==="
          if ! docker run --rm \
              -v /opt/miboleta/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
              nginx:1.27-alpine nginx -t; then
            echo "❌ nginx.conf invalido: no se recarga, el sitio sigue con el conf anterior"
            exit 1
          fi
          docker service update --force miboleta_nginx || echo "⚠ No se pudo forzar nginx"

          echo "=== Final service status ==="
          docker stack services miboleta
          
          echo "=== Deploy complete! ==="
          DEPLOY_SCRIPT
      
      - name: Disconnect VPN
        if: always()
        run: |
          echo "Disconnecting VPN..."
          sudo kill $(cat /tmp/vpn_pid 2>/dev/null) 2>/dev/null || true
          sudo rm -f /tmp/vpn_config /tmp/vpn_pid
          echo "VPN disconnected"
