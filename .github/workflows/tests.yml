name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Debounce del pipeline: al mergear varios PRs seguidos, los runs de Tests de
# commits ya superados se cancelan. Como Build & Deploy depende de que Tests
# pase (workflow_run), sus deploys tampoco se disparan -> un burst de merges
# colapsa a un solo deploy del último estado de main.
# El group aísla por rama/PR (head_ref en PRs, ref en push) para no cancelar
# los tests de otra rama.
concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  access-matrix-guards:
    name: Access Matrix Guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Sin composer install: el script lee config/access_matrix.php con require
      # (es un array plano) y escanea el resto por texto. No arranca Laravel.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Check access matrix guards
        run: php scripts/check-access-matrix.php

  backend-tests:
    name: Backend Tests (Laravel)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json, pdo
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run tests (SQLite in-memory)
        run: php artisan test

  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Falla solo ante errores; los warnings (any, exhaustive-deps...) son
      # deuda preexistente y no bloquean. Caza las Rules of Hooks y los
      # selectores de zustand que devuelven un valor nuevo — las dos causas del
      # "Maximum update depth exceeded" que costó un debug caro.
      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build check (includes TypeScript validation)
        run: npm run build
