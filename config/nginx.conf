server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.html index.php;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Client upload size
    client_max_body_size 20M;

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Serve static files directly
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
    }

    # API routes go to Laravel (always pass to PHP-FPM)
    location /api {
        try_files $uri /index.php?$query_string;
    }

    # Horizon dashboard go to Laravel (always pass to PHP-FPM)
    location /horizon {
        try_files $uri /index.php?$query_string;
    }

    # Storage files (uploaded files, logos, etc.) servidos directo del volumen.
    # `^~` es OBLIGATORIO: sin él, la regex de estáticos de arriba
    # (~* \.(jpg|png|...)$) gana sobre este prefijo y las imágenes bajo /storage
    # se buscan en el root equivocado (/var/www/html/public/storage, que no
    # existe) -> caen a index.php -> Laravel 404. Con `^~`, nginx no evalúa las
    # regex cuando /storage es el prefijo más largo y usa el alias de abajo.
    location ^~ /storage {
        alias /var/www/html/storage/app/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Laravel Reverb WebSocket proxy
    location /app {
        # Con el nombre directo, nginx exige resolver `reverb` al ARRANCAR: si
        # ese servicio aun no esta arriba, se niega a arrancar entero ("host
        # not found in upstream") y cae el sitio completo por un servicio
        # secundario. Con variable + resolver arranca igual y resuelve al
        # llegar la primera peticion.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_reverb reverb:8080;
        proxy_pass http://$backend_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Laravel PHP handler
    location ~ \.php$ {
        # Con el nombre directo, nginx resuelve `app` una sola vez al arrancar
        # y cachea la IP para siempre. Si el contenedor de PHP se reinicia
        # cambia de IP y nginx sigue apuntando a la vieja: 502 permanente hasta
        # reiniciar nginx a mano. Con variable, vuelve a resolver contra el DNS
        # interno de Docker.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_php app:9000;
        fastcgi_pass $backend_php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # SPA fallback - serve index.html for all non-file routes
    # This allows React Router to handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
