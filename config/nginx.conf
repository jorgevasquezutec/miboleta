server {
    listen 80;
    # HTTPS con el certificado RapidSSL de www.mi-boleta.com / mi-boleta.com.
    # docker-stack.yml monta /opt/miboleta/ssl en /etc/nginx/ssl: si faltan
    # estos dos archivos nginx no arranca, así que se copian ANTES que este conf.
    listen 443 ssl;
    http2 on;
    server_name _;
    root /var/www/html/public;

    ssl_certificate     /etc/nginx/ssl/mi-boleta.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mi-boleta.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Todo el tráfico http va a https, salvo /health (chequeos internos por el
    # puerto 80). nginx no tiene `if` compuestos: de ahí la variable.
    set $redir_https 0;
    if ($scheme = http) { set $redir_https 1; }
    if ($uri = /health) { set $redir_https 0; }
    if ($redir_https = 1) { return 301 https://$host$request_uri; }

    index index.html index.php;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Client upload size
    client_max_body_size 20M;

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Serve static files directly
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
    }

    # El worker de PDF.js (assets/pdf.worker*.mjs) es un modulo ES. mime.types
    # de nginx no trae la extension .mjs (solo "js"), asi que sin esto lo sirve
    # como application/octet-stream y el navegador rechaza el import() dinamico
    # con "Failed to fetch dynamically imported module": el visor de documentos
    # queda en blanco para TODOS los PDFs.
    #
    # Este archivo es el que monta docker-stack.yml en NUESTRA produccion de
    # Swarm; el del cliente es entrega/produccion/nginx.conf. Los dos necesitan
    # el bloque, y se quedaron desincronizados al arreglar solo el segundo.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API routes go to Laravel (always pass to PHP-FPM)
    location /api {
        try_files $uri /index.php?$query_string;
    }

    # Horizon dashboard go to Laravel (always pass to PHP-FPM)
    location /horizon {
        try_files $uri /index.php?$query_string;
    }

    # Storage files (uploaded files, logos, etc.) servidos directo del volumen.
    # `^~` es OBLIGATORIO: sin él, la regex de estáticos de arriba
    # (~* \.(jpg|png|...)$) gana sobre este prefijo y las imágenes bajo /storage
    # se buscan en el root equivocado (/var/www/html/public/storage, que no
    # existe) -> caen a index.php -> Laravel 404. Con `^~`, nginx no evalúa las
    # regex cuando /storage es el prefijo más largo y usa el alias de abajo.
    location ^~ /storage {
        alias /var/www/html/storage/app/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Laravel Reverb WebSocket proxy
    location /app {
        # Con el nombre directo, nginx exige resolver `reverb` al ARRANCAR: si
        # ese servicio aun no esta arriba, se niega a arrancar entero ("host
        # not found in upstream") y cae el sitio completo por un servicio
        # secundario. Con variable + resolver arranca igual y resuelve al
        # llegar la primera peticion.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_reverb reverb:8080;
        proxy_pass http://$backend_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Laravel PHP handler
    location ~ \.php$ {
        # Con el nombre directo, nginx resuelve `app` una sola vez al arrancar
        # y cachea la IP para siempre. Si el contenedor de PHP se reinicia
        # cambia de IP y nginx sigue apuntando a la vieja: 502 permanente hasta
        # reiniciar nginx a mano. Con variable, vuelve a resolver contra el DNS
        # interno de Docker.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_php app:9000;
        fastcgi_pass $backend_php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # SPA fallback - serve index.html for all non-file routes
    # This allows React Router to handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
