version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miboleta_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./backend/storage:/var/www/html/storage
      - ./backend/bootstrap/cache:/var/www/html/bootstrap/cache
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=miboleta
      - DB_USERNAME=miboleta_user
      - DB_PASSWORD=secret123
    depends_on:
      - mysql
    networks:
      - miboleta_network

  nginx:
    image: nginx:alpine
    container_name: miboleta_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - miboleta_network

  mysql:
    image: mysql:8.0
    container_name: miboleta_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: miboleta
      MYSQL_USER: miboleta_user
      MYSQL_PASSWORD: secret123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - miboleta_network

  adminer:
    image: adminer:latest
    container_name: miboleta_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=mysql
    depends_on:
      - mysql
    networks:
      - miboleta_network

volumes:
  mysql_data:
    driver: local

networks:
  miboleta_network:
    driver: bridge
