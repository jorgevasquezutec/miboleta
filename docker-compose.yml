services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miboleta_app
    tty: true
    working_dir: /var/www/html
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
      - redis
    networks:
      - miboleta_network

  nginx:
    image: nginx:alpine
    container_name: miboleta_nginx
    tty: true
    ports:
      - "${MIBOLETA_HTTP_PORT:-8090}:80"
      - "${MIBOLETA_HTTPS_PORT:-8443}:443"
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./backend/storage/app/public:/var/www/html/public/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - miboleta_network

  db:
    image: mysql:8.0
    container_name: miboleta_mysql
    tty: true
    # restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: miboleta
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    cap_add:
      - SYS_NICE  # CAP_SYS_NICE
    ports:
      - "${MIBOLETA_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - miboleta_network

  # Redis para queues y cache
  redis:
    image: redis:7-alpine
    container_name: miboleta_redis
    # restart: unless-stopped
    ports:
      - "${MIBOLETA_REDIS_PORT:-6399}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - miboleta_network

  # Laravel Horizon - Queue Worker
  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miboleta_horizon
    # restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan horizon
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - app
      - redis
    networks:
      - miboleta_network

  # Laravel Reverb - WebSocket Server
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miboleta_reverb
    # restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${MIBOLETA_REVERB_PORT:-8085}:8080"
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - app
      - redis
    networks:
      - miboleta_network

  adminer:
    image: adminer:latest
    command: [ "php", "-d", "memory_limit=4G", "-d", "upload_max_filesize=10G", "-d", "post_max_size=10G", "-S", "[::]:8080", "-t", "/var/www/html" ]
    container_name: miboleta_adminer
    ports:
      - "${MIBOLETA_ADMINER_PORT:-8091}:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db
    depends_on:
      - db
    networks:
      - miboleta_network

  # Sidecar de firma digital legal (Ghostscript + pyHanko). No expone puerto al
  # host (solo red interna); el backend lo alcanza vía http://signer:8000.
  # Spike manual: docker compose run --rm signer python /opt/signer/spike_sign.py <pdf>
  signer:
    build:
      context: ./signer
      dockerfile: Dockerfile
    container_name: miboleta_signer
    working_dir: /var/www/html
    command: ["uvicorn", "app:app", "--app-dir", "/opt/signer", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./backend:/var/www/html
    networks:
      - miboleta_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  miboleta_network:
    driver: bridge
