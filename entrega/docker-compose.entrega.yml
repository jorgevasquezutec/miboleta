# MiBoleta — stack de ENTREGA / DEMOSTRACIÓN
# ---------------------------------------------------------------------------
# Copia autocontenida de la plataforma, pensada para dos usos:
#
#   1. Demostrar que la versión entregada FUNCIONA, en una máquina limpia y sin
#      acceso a la infraestructura del proveedor.
#   2. Producir los pantallazos del manual sobre datos ficticios, para que la
#      documentación no publique nombres ni DNIs de empleados reales.
#
# Diferencias deliberadas con docker-compose.yml (desarrollo):
#
#   - Sin bind-mounts del código: todo sale de la imagen, que es lo que se
#     entrega y lo que queda congelado como prueba. En desarrollo se monta
#     ./backend encima y la imagen deja de ser la fuente de verdad.
#   - Sin container_name fijos: así este stack convive con el de desarrollo
#     corriendo a la vez (los nombres los prefija el proyecto de compose).
#   - Puertos altos, por lo mismo.
#   - Mailpit en vez de un SMTP real: la firma de documentos manda un código
#     por correo, y sin un buzón local ese flujo no se puede demostrar en una
#     máquina sin conexión ni credenciales de correo.
#
# Uso:
#   docker compose -f entrega/docker-compose.entrega.yml -p miboleta_entrega up -d
#   docker compose -f entrega/docker-compose.entrega.yml -p miboleta_entrega down -v
#
# La imagen se fija por DIGEST (no por :latest) cuando se arma el paquete
# definitivo: una etiqueta se puede mover o borrar, y dentro de dos años
# ':latest' no prueba qué se entregó. Ver entrega/DIGESTS.txt.

services:
  app:
    image: ${MIBOLETA_IMAGE:-ghcr.io/jorgevasquezutec/miboleta:latest}
    environment:
      SERVICE_NAME: app
      # El app copia su public/ (frontend ya compilado dentro de la imagen) al
      # volumen compartido que sirve nginx.
      COPY_PUBLIC_TO_VOLUME: "true"
      # Siembra en el primer arranque con los datos de demostración completos.
      RUN_SEEDERS: "true"
      SEEDER_CLASS: 'Database\Seeders\DemoSeeder'
    env_file:
      - ./.env.app
    volumes:
      - public_files:/var/www/html/public-shared
      - storage_data:/var/www/html/storage
      - cache_data:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [miboleta]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${MIBOLETA_HTTP_PORT:-9090}:80"
    volumes:
      - public_files:/var/www/html/public:ro
      - storage_data:/var/www/html/storage:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [miboleta]

  db:
    # mysql:8.0 y no :8.0-debian (que sí usa producción): la variante debian no
    # publica manifiesto arm64, así que el paquete no arrancaría en un Mac con
    # Apple Silicon ni en un Windows ARM. La imagen multi-arquitectura hace que
    # el disco funcione en cualquier máquina del cliente, que es el punto.
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: demo_root
      MYSQL_DATABASE: miboleta
      MYSQL_USER: miboleta
      MYSQL_PASSWORD: demo_pass
    # Credenciales de demostración a propósito: esta base solo contiene datos
    # ficticios y el stack no se expone a internet.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdemo_root"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [miboleta]

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    networks: [miboleta]

  # horizon y reverb comparten imagen y entrypoint con app. RUN_MIGRATIONS=false
  # porque solo UN contenedor debe migrar: arrancando a la vez competían por las
  # migraciones y los perdedores morían con "Table 'migrations' already exists",
  # dejando la copia sin colas ni notificaciones en tiempo real.
  horizon:
    image: ${MIBOLETA_IMAGE:-ghcr.io/jorgevasquezutec/miboleta:latest}
    command: php artisan horizon
    environment:
      RUN_MIGRATIONS: "false"
    env_file:
      - ./.env.app
    volumes:
      - storage_data:/var/www/html/storage
      - cache_data:/var/www/html/bootstrap/cache
    restart: unless-stopped
    depends_on: [app]
    networks: [miboleta]

  reverb:
    image: ${MIBOLETA_IMAGE:-ghcr.io/jorgevasquezutec/miboleta:latest}
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      RUN_MIGRATIONS: "false"
    ports:
      - "${MIBOLETA_REVERB_PORT:-9085}:8080"
    env_file:
      - ./.env.app
    restart: unless-stopped
    depends_on: [app]
    networks: [miboleta]

  # Servicio de firma digital PAdES (Python + Ghostscript + pyHanko). Va en un
  # contenedor aparte porque su stack no tiene nada que ver con el de PHP.
  # Comparte el volumen storage_data con app y horizon: el PDF se firma en
  # disco, no viaja por la red.
  #
  # El sellado de tiempo (TSA) es su única dependencia externa: sin salida a
  # internet la firma se produce igual, pero sin sello cualificado.
  signer:
    image: ${MIBOLETA_SIGNER_IMAGE:-ghcr.io/jorgevasquezutec/miboleta-signer:latest}
    working_dir: /var/www/html
    command: ["uvicorn", "app:app", "--app-dir", "/opt/signer", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - storage_data:/var/www/html/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks: [miboleta]

  # Buzón de correo local: sin él no se puede demostrar la firma de documentos,
  # que envía un código de verificación por correo. Bandeja en el navegador.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MIBOLETA_MAILPIT_PORT:-9025}:8025"
    networks: [miboleta]

  # Para inspeccionar la base durante la demostración o una auditoría.
  adminer:
    image: adminer:4.8.1
    ports:
      - "${MIBOLETA_ADMINER_PORT:-9091}:8080"
    depends_on: [db]
    networks: [miboleta]

volumes:
  mysql_data:
  redis_data:
  public_files:
  storage_data:
  cache_data:

networks:
  miboleta:
    driver: bridge
