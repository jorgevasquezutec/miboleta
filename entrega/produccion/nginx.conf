#
#   1. Parar nginx (certbot necesita el puerto 80 libre):
#        docker compose -f docker-compose.produccion.yml -p miboleta stop nginx
#   2. sudo certbot certonly --standalone -d miboleta.suempresa.com
#   3. Copiar los certificados a ./ssl con estos nombres EXACTOS:
#        sudo cp /etc/letsencrypt/live/SU-DOMINIO/fullchain.pem ssl/
#        sudo cp /etc/letsencrypt/live/SU-DOMINIO/privkey.pem  ssl/
#        sudo chown "$USER": ssl/*.pem
#   4. Descomentar SOLO lo que hay entre las marcas de abajo: quitar el "# "
#      del principio de cada linea.
#   5. Poner APP_URL con https:// en el .env
#   6. Aplicar (up -d, NO restart: restart no relee el .env):
#        docker compose -f docker-compose.produccion.yml -p miboleta up -d
#
# Este bloque es una copia EXACTA del server de arriba mas las lineas de TLS.
# Si alguna vez se toca el de 80, hay que replicar el cambio aqui: si no, al
# activar HTTPS dejarian de funcionar cosas que si van por HTTP.
#
# Para que el HTTP redirija al HTTPS, anada esta linea como PRIMERA del
# bloque `server { listen 80; ... }` de mas arriba:
#
#     return 301 https://$host$request_uri;
#
# AVISO PARA QUIEN EDITE ESTE ARCHIVO: entre las dos marcas de abajo no puede
# quedar NADA que no sea configuracion de nginx, ni una linea de adorno ni una
# nota. Todo lo que haya en medio se descomenta, y nginx muere al arrancar con
# `unknown directive`. Las explicaciones van aqui arriba, fuera de las marcas.
